name: Actualizar página

on:
  schedule:
    - cron: '7 11 * * *'      # todos los días, 5:07 a. m. de Honduras: actualización completa
    - cron: '*/15 * * * *'    # cada 15 minutos (GitHub suele atrasarlas): alineaciones por salir y resultados recién terminados
  workflow_dispatch:          # botón "Run workflow" para actualizar a mano (y la cadena de alineaciones, abajo)
    inputs:
      modo:
        description: 'completo o rapido'
        default: 'completo'
  push:
    branches: [main]
    paths: ['src/**', 'data/modelo/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  deployments: read

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      cambios: ${{ steps.run.outputs.cambios }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main      # lo último de main: si otra corrida guardó datos mientras esta esperaba, no choca al guardar

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Elegir modo
        id: modo
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "*/15 * * * *" ] || [ "${{ github.event.inputs.modo }}" = "rapido" ]; then
            echo "modo=rapido" >> "$GITHUB_OUTPUT"
            python src/revisar.py
          else
            echo "modo=completo" >> "$GITHUB_OUTPUT"
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependencias
        if: steps.modo.outputs.seguir == 'si'
        run: pip install -r requirements.txt

      - name: Descargar datos, recalcular y armar la página
        id: run
        if: steps.modo.outputs.seguir == 'si'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/ejecutar.py ${{ steps.modo.outputs.modo }}

      - name: Guardar los datos nuevos en el repositorio
        if: steps.run.outputs.cambios == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
          # si otra corrida tocó el mismo archivo, se queda lo de esta (es lo más nuevo)
          if ! git pull --rebase --autostash; then
            git rebase --abort || true
            git pull --no-rebase --no-edit -X ours || true
          fi
          git push || echo "No se pudo guardar; se intentará en la próxima corrida"

      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.cambios == 'si'
        with:
          path: site

  publicar:
    needs: actualizar
    if: needs.actualizar.outputs.cambios == 'si'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Las corridas van de una en una (concurrency), así que una publicación que sigue "en curso" al empezar esta quedó
      # trabada en GitHub Pages y bloquea todas las siguientes (pasó el 4 nov 2026: 18:36-19:30 UTC sin publicar, con los
      # onces de la Champions ya bajados). Se cancela antes de publicar.
      - name: Cancelar publicación trabada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=6" --jq '.[].sha' 2>/dev/null); do
            st=$(gh api "repos/${{ github.repository }}/pages/deployments/$sha" --jq .status 2>/dev/null || true)
            case "$st" in
              deployment_queued|deployment_in_progress|syncing_files|finished_file_sync|updating_pages)
                echo "Publicación $sha trabada ($st): se cancela"
                gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" || true ;;
            esac
          done
      - id: deploy
        uses: actions/deploy-pages@v4

  # Alineaciones: GitHub atrasa las corridas programadas (a veces una hora), y el once sale ~1 hora antes. Si hay partidos que
  # empiezan en la próxima hora y cuarto sin alineación todavía, la corrida se vuelve a lanzar sola a los 3 minutos.
  cadena:
    needs: [actualizar, publicar]
    if: always() && needs.actualizar.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: ¿Hay alineaciones por salir?
        id: c
        run: python src/revisar.py --cadena
      - name: Lanzar otra corrida rápida
        if: steps.c.outputs.cadena == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 180
          # si ya hay una corrida esperando (otra rápida o la completa) no se lanza otra: GitHub cancelaría la que espera
          # (pasó el 4 nov 2026 con una completa lanzada a mano) y la que espera ya baja las alineaciones
          n=0
          for st in pending queued waiting requested; do
            n=$((n + $(gh api "repos/${{ github.repository }}/actions/workflows/actualizar.yml/runs?status=$st&per_page=5" --jq '.total_count' 2>/dev/null || echo 0)))
          done
          if [ "$n" -gt 0 ]; then echo "Ya hay $n corrida(s) esperando: no se lanza otra"; exit 0; fi
          gh workflow run actualizar.yml --ref main -f modo=rapido

  # El despertador (despertador.yml) se vuelve a armar después de cada corrida. Las corridas que lanza la cadena con
  # github.token no disparan "workflow_run", así que se lo llama directo (5 nov 2026).
  despertar:
    needs: [actualizar, publicar, cadena]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Armar el despertador
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run despertador.yml --repo ${{ github.repository }} --ref main || true
