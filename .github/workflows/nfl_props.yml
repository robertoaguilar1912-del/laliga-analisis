name: Props de la NFL (ESPN)
# Solo a mano: props de jugadores de juegos ya jugados y la ficha completa de cada jugador (ver src/nfl_props.py), para la
# prueba de props con temporadas pasadas. Solo baja lo que falta.
on:
  workflow_dispatch:
    inputs:
      temporadas: {description: 'Temporadas (año en que empiezan)', default: '2024 2025 2026'}
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: cd src && python nfl_props.py ${{ github.event.inputs.temporadas }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/nfl_props_*.csv.gz data/raw/nfl_jug_*.csv.gz
          git diff --cached --quiet && exit 0
          git commit -q -m "Props y fichas de jugadores de la NFL (ESPN) $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash && git push -q && exit 0; sleep 15; done
          exit 1
