name: Revisar props de la NBA en ESPN
# Solo a mano (o al cambiar el script): ¿ESPN guarda los props de jugadores de juegos pasados? Sale en el registro de la corrida.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/diag_props.py']
permissions:
  contents: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: cd src && python diag_props.py
