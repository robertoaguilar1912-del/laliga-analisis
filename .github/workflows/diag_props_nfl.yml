name: Revisar props de la NFL (ESPN)
# Solo a mano (o al cambiar el script): ¿qué props de jugadores de la NFL guarda ESPN? Sale en el registro de la corrida.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/diag_props_nfl.py']
permissions:
  contents: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: cd src && python diag_props_nfl.py
